<svg version="1.1" xmlns="http://www.w3.org/2000/svg" style="background: white;" width="400"
    height="300">   

    <text x="48" y="50" font-size="32">A</text> 
    <ellipse cx="80" cy="150" rx="50" ry="100" fill="none" stroke="black" />
    <text x="70" y="100" font-size="24">1</text>
    <text x="50" y="140" font-size="24">2</text>
    <text x="90" y="180" font-size="24">3</text>
    <text x="70" y="220" font-size="24">4</text>

    <text x="250" y="50" font-size="32">B</text> 
    <ellipse id="elipseB" cx="280" cy="150" rx="50" ry="100" fill="none" stroke="black" />
    <text x="270" y="100" font-size="24">9</text> 
    <text x="295" y="140" font-size="24">8</text>
    <text x="250" y="180" font-size="24">7</text>
    <text x="290" y="220" font-size="24">6</text> 

    <text x="170" y="50" font-size="32">&#x1D453;</text>
<!-- Flechas -->
<defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="2" orient="auto">
        <polygon points="0 0, 10 2, 0 4" />
    </marker>
</defs>
<line x1="90" y1="90" x2="250" y2="90" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="65" y1="132" x2="270" y2="130" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="110" y1="170" x2="230" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
<line x1="85" y1="210" x2="260" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
</svg>